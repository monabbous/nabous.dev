name: Deploy

on:
  push:
    branches: [master]
    paths:
      - '**/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect prerequisites or deploy the runtime'
        type: choice
        default: deploy
        options: [inspect, deploy]
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: nabous-dev-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: inputs.mode != 'inspect'
        with:
          node-version: '24'
      - name: Validate runtime application
        if: inputs.mode != 'inspect'
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm test
      - name: Build production image on CI
        if: inputs.mode != 'inspect'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            -t "nabous-dev-runtime:$DEPLOY_SHA" .
          docker save "nabous-dev-runtime:$DEPLOY_SHA" | gzip > release.tar.gz
          echo "IMAGE_SHA256=$(sha256sum release.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Transfer production image
        if: inputs.mode != 'inspect'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: release.tar.gz
          target: /opt/nabous.dev-incoming/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Encode runtime configuration
        if: inputs.mode != 'inspect'
        env:
          NABOUS_PROJECTS: ${{ vars.NABOUS_PROJECTS }}
        run: |
          node -e 'const fs=require("node:fs");const value=process.env.NABOUS_PROJECTS;if(!Array.isArray(JSON.parse(value)))throw Error("Set NABOUS_PROJECTS repository variable first");fs.appendFileSync(process.env.GITHUB_ENV,"PROJECTS_BASE64="+Buffer.from(value).toString("base64")+"\n")'
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PROJECTS_BASE64: ${{ env.PROJECTS_BASE64 }}
          CONTENT_CACHE_SECONDS: ${{ vars.NABOUS_CONTENT_CACHE_SECONDS || '0' }}
          IMAGE_ARCHIVE: /opt/nabous.dev-incoming/${{ github.run_id }}-${{ github.run_attempt }}/release.tar.gz
          IMAGE_SHA256: ${{ env.IMAGE_SHA256 }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DEPLOY_SHA,PROJECTS_BASE64,CONTENT_CACHE_SECONDS,IMAGE_ARCHIVE,IMAGE_SHA256
          command_timeout: 30m
          script: |
            set -eu
            if [ '${{ inputs.mode }}' = inspect ]; then
              docker version --format '{{.Server.Version}}'
              nginx -t
              ls -l /etc/nginx/sites-enabled
              cat /etc/nginx/sites-enabled/nabous.dev.conf
              nginx -T 2>/dev/null | grep -E '^# configuration file|^[[:space:]]*(server_name|root |listen |location |try_files )'
              docker ps --filter name=nabous --format '{{.Names}} {{.Image}} {{.Ports}}'
              df -h / /var/lib/docker
              docker system df
              exit 0
            fi
            if [ ! -d /opt/nabous.dev-runtime/.git ]; then
              git clone https://github.com/monabbous/nabous.dev.git /opt/nabous.dev-runtime
            fi
            cd /opt/nabous.dev-runtime
            git fetch origin "$DEPLOY_SHA"
            git switch --detach "$DEPLOY_SHA"
            bash scripts/deploy-runtime.sh
      - name: Remove transferred archive
        if: always() && inputs.mode != 'inspect'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -eu
            incoming=/opt/nabous.dev-incoming/${{ github.run_id }}-${{ github.run_attempt }}
            rm -f -- "$incoming/release.tar.gz"
            if [ -d "$incoming" ]; then rmdir -- "$incoming"; fi
