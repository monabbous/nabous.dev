name: Deploy

on:
  push:
    branches: [master]
    paths:
      - '**/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect prerequisites or deploy the runtime'
        type: choice
        default: deploy
        options: [inspect, deploy]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -eu
            if [ '${{ inputs.mode }}' = inspect ]; then
              docker version --format '{{.Server.Version}}'
              nginx -t
              ls -l /etc/nginx/sites-enabled
              nginx -T 2>/dev/null | grep -E '^# configuration file|^[[:space:]]*(server_name|root |listen |location |try_files )'
              docker ps --filter name=nabous --format '{{.Names}} {{.Image}} {{.Ports}}'
              exit 0
            fi
            echo 'Runtime deployment is being prepared; existing static files are not modified.'
            exit 1
