name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build production application
        run: pnpm build
      - name: Smoke-test generated favicon endpoints
        run: |
          pnpm exec next start -p 3100 > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          trap 'kill $(cat /tmp/next-start.pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const assert = require('node:assert/strict');
          const base = 'http://localhost:3100';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function get(path) {
            const response = await fetch(base + path);
            assert.equal(response.status, 200, path + ' status');
            return response;
          }
          (async () => {
            let ready = false;
            for (let i = 0; i < 30; i++) {
              try { await get('/'); ready = true; break; } catch { await sleep(1000); }
            }
            assert.ok(ready, 'Next.js server failed to start');
            for (const [path, size] of [['/icon', 32], ['/apple-icon', 180]]) {
              const response = await get(path);
              assert.match(response.headers.get('content-type') || '', /image\/png/);
              const bytes = Buffer.from(await response.arrayBuffer());
              assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', path + ' PNG signature');
              assert.equal(bytes.readUInt32BE(16), size, path + ' width');
              assert.equal(bytes.readUInt32BE(20), size, path + ' height');
            }
            const svg = await get('/nabous-dev-logo.svg');
            assert.match(svg.headers.get('content-type') || '', /svg/);
            const manifest = await get('/manifest.webmanifest');
            assert.ok((await manifest.json()).icons.length > 0);
            const html = await (await get('/')).text();
            assert.match(html, /nabous-dev-logo\.svg/);
            assert.match(html, /apple-icon/);
            console.log('Favicon endpoints, dimensions, manifest and homepage metadata verified.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
